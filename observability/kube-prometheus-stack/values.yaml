# Values for the kube-prometheus-stack chart, release name "kps".
# Everything not set here is a chart default on purpose. Each override
# below exists for a reason I can state, defaults need no defence.

# The chart ships scrape jobs for the control-plane components. kind
# runs them bound to 127.0.0.1 inside the control-plane container, so
# nothing on the pod network can reach them, and on GKE they are
# managed by Google and not exposed at all. Both targets of this lab
# therefore report them permanently down. This lab observes an
# application rather than a control plane, so the jobs are off.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# node-exporter collects host-level metrics: disk, network, CPU of the
# machine itself. Nothing in this lab reads them. It runs as a
# DaemonSet, so on a three node cluster it is three more pods
# competing for memory that the logging and tracing backends need.
# Scoped out rather than switched off to save face, the repo is about
# observing a workload.
nodeExporter:
  enabled: false

prometheus:
  prometheusSpec:
    # Lab retention. The cluster lives for hours, not weeks.
    retention: 24h
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    # By default the chart only picks up ServiceMonitors and rules that
    # carry its own release label. These three turn that off so the
    # app's ServiceMonitor and PrometheusRule in the app namespace are
    # discovered without label gymnastics.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  # Alertmanager runs so firing alerts are visible end to end, but no
  # receivers are configured. Routing to a real channel is a production
  # delta, documented in docs/production-deltas.md.
  enabled: true

grafana:
  # Lab credential. Grafana sits behind port-forward only, it is never
  # exposed on a LoadBalancer or Ingress in this lab.
  adminPassword: admin
  sidecar:
    dashboards:
      # picks up any ConfigMap labelled grafana_dashboard=1 in any
      # namespace, which is how observability/dashboards/ gets loaded
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
