apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  # image is loaded into kind with `kind load docker-image demo-app:dev`,
  # never pulled, hence the Never pull policy in the patch below
  - name: demo-app
    newTag: dev
patches:
  - path: patch-deployment.yaml
