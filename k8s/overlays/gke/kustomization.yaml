apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  # The --platform flag is not optional. This laptop is arm64 and GKE's
  # e2-medium nodes are amd64, so an image built without it starts and
  # immediately dies with "exec format error". v1 was built that way.
  #
  #   docker build --platform linux/amd64 \
  #     -t europe-west1-docker.pkg.dev/moyo-cloud-lab/tf-lab-images/demo-app:v2 app/
  #   docker push europe-west1-docker.pkg.dev/moyo-cloud-lab/tf-lab-images/demo-app:v2
  #
  # New tag rather than overwriting v1, so the broken image stays
  # distinguishable from the working one.
  - name: demo-app
    newName: europe-west1-docker.pkg.dev/moyo-cloud-lab/tf-lab-images/demo-app
    newTag: v2
patches:
  - path: patch-deployment.yaml
