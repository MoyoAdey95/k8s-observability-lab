apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  # set to your Artifact Registry path before deploying, e.g.
  #   kustomize edit set image demo-app=europe-west1-docker.pkg.dev/PROJECT_ID/lab/demo-app:v1
  - name: demo-app
    newName: europe-west1-docker.pkg.dev/PROJECT_ID/lab/demo-app
    newTag: v1
patches:
  - path: patch-deployment.yaml
