apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 2
  maxReplicas: 5
  # 70% of the CPU *request* (50m), so sustained load above ~35m per
  # pod scales out. Low on purpose, it makes scale-out demonstrable
  # with a laptop-sized load test.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # default scale-down is eager, a small stabilisation window stops
      # replica flapping when load is bursty
      stabilizationWindowSeconds: 120
