apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  # Without this finalizer, deleting the Application leaves its
  # Deployment, Service and HPA running in the cluster with nothing
  # managing them. With it, Argo CD removes them first.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/MoyoAdey95/k8s-observability-lab.git
    # Tracking a branch means every push to main is a deployment. That
    # is the point here and it is also the thing you would not do in
    # production, where an environment tracks a tag or a digest and
    # promotion is a deliberate act. Noted in docs/production-deltas.md.
    targetRevision: main
    # Argo CD runs kustomize itself when it finds a kustomization.yaml,
    # so this is the same overlay that `kubectl apply -k` used before.
    path: k8s/overlays/gke

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    automated:
      # Delete a manifest from git and the object goes with it. Off by
      # default because it will happily delete things if you point an
      # Application at the wrong path.
      prune: true
      # Revert anything changed in the cluster that does not match git.
      # This is what commit 8 demonstrates, and it is also why
      # `argocd app rollback` refuses to run while it is on.
      selfHeal: true
    syncOptions:
      # The app namespace used to be created by the bootstrap script.
      # Argo CD makes it now, so a fresh cluster needs nothing applied
      # by hand except the root Application.
      - CreateNamespace=true
      # Pairs with ignoreDifferences below. On its own,
      # ignoreDifferences only stops the Application reporting
      # OutOfSync: the next sync still applies the manifest as written,
      # replicas included, and still overwrites the autoscaler. This
      # option is what makes the sync leave the ignored field alone.
      - RespectIgnoreDifferences=true

  # The Deployment in git says replicas: 2 and the HPA scales between 2
  # and 5. Under `kubectl apply` that was harmless, because nothing went
  # back and reasserted the manifest. Under selfHeal it is a fight: the
  # HPA scales to 3, Argo CD sees a cluster that does not match git, and
  # scales it back to 2.
  #
  # The alternative is deleting replicas from k8s/base/deployment.yaml
  # and letting the HPA own the number outright, which is the usual
  # advice. It is not taken here because the local overlay runs on kind
  # with no metrics-server, so there is no HPA there and the deployment
  # would come up with the Kubernetes default of one pod.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: demo-app
      jsonPointers:
        - /spec/replicas
