apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Pinned at 7.3.0 after checking with `helm template` that these
  # values still render a single binary on the 7 series. One
  # StatefulSet, no read/write/backend split, no memcached, so
  # deploymentMode, chunksCache and resultsCache are all still read.
  # Repo 5 installed whatever was newest that day and recorded
  # nothing, so the version it ran is unknowable. This pin is the
  # first time the chart version has been a decision.
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/observability/loki/values.yaml
    - repoURL: https://github.com/MoyoAdey95/k8s-observability-lab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
