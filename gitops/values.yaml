# Argo CD on a two node lab cluster that is already running the
# observability stack. Two subcharts are switched off because nothing
# here uses them and each one is a pod competing for the same nodes.
#
#   dex            single sign-on, and there is one user
#   notifications  pushes sync events to chat or email, and there is
#                  nobody to notify
#
# The ApplicationSet controller was in this list as applicationSet.enabled
# until the first install showed its pod running anyway. Chart 10.10.3 has
# no such key. ApplicationSet is a core component there and the only lever
# is applicationSet.replicas. Helm accepted the invented key without a
# word, because this chart ships no values.schema.json, so there was
# nothing to validate against. The controller is left running and the
# cluster has the headroom for it. docs/gitops.md has the rest.
dex:
  enabled: false
notifications:
  enabled: false

configs:
  params:
    # Production terminates TLS at an ingress or load balancer in front
    # of Argo CD. There is no ingress here, access is a port-forward on
    # the loopback interface, and insecure mode avoids a self-signed
    # certificate warning on every visit. Lab-only, and listed as such
    # in docs/gitops.md.
    server.insecure: true
